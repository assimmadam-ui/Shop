    <div id="root"></div>
<script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Custom Icon Component leveraging Lucide Icons
        const Icon = ({ name, size = 20, className = "" }) => {
            return <i data-lucide={name} className={`inline-block ${className}`} style={{ width: size, height: size }}></i>;
        };

        // Standard Units List for Items
        const UNITS = ['pcs', 'kg', 'gm', 'ltr', 'ml', 'box', 'bottle', 'packet', 'meter'];

        function App() {
            // Main active screen tab: 'home', 'new_sale', 'stock', 'dues', 'expenses', 'reports'
            const [activeTab, setActiveTab] = useState('home');
            
            // Currency state
            const [currency, setCurrency] = useState('AED');

            // Date Filter State (Defaults to Today YYYY-MM-DD)
            const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [selectedMonth, setSelectedMonth] = useState(() => new Date().toISOString().slice(0,7));

            // Shop / Owner Settings Info
            const [shopInfo, setShopInfo] = useState(() => {
                const saved = localStorage.getItem('smart_shop_info_v9');
                return saved ? JSON.parse(saved) : {
                    name: 'My Retail Store',
                    owner: 'Store Owner',
                    phone: '+971 50 123 4567',
                    address: 'Shop No. 12, Main Street, Dubai, UAE'
                };
            });

            // Sales Records List
            const [salesList, setSalesList] = useState(() => {
                const saved = localStorage.getItem('smart_shop_sales_v9');
                return saved ? JSON.parse(saved) : [];
            });

            // Expense Records List
            const [expenseList, setExpenseList] = useState(() => {
                const saved = localStorage.getItem('smart_shop_expenses_v9');
                return saved ? JSON.parse(saved) : [];
            });

            // Customer Dues Payments Log (for partial or full credit settlements)
            const [duesPayments, setDuesPayments] = useState(() => {
                const saved = localStorage.getItem('smart_shop_dues_payments_v9');
                return saved ? JSON.parse(saved) : [];
            });

            // Sales Return / Exchange records
            const [returnsList, setReturnsList] = useState(() => {
                try {
                    const saved = localStorage.getItem('smart_shop_returns_v1');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });

            // Stock inventory: current quantity per item + movement history.
            const [stockList, setStockList] = useState(() => {
                try {
                    const saved = localStorage.getItem('smart_shop_stock_v1');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const [stockMovements, setStockMovements] = useState(() => {
                try {
                    const saved = localStorage.getItem('smart_shop_stock_movements_v1');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const [stockForm, setStockForm] = useState({ id:null, name:'', unit:'pcs', qty:'', lowStock:'5' });
            const [stockSearch, setStockSearch] = useState('');
            const [returnModal, setReturnModal] = useState({ show: false });
            const [returnBillSearch, setReturnBillSearch] = useState('');
            const [selectedReturnSaleId, setSelectedReturnSaleId] = useState('');
            const [returnAmount, setReturnAmount] = useState('');
            const [returnType, setReturnType] = useState('cash_refund');
            const [returnMode, setReturnMode] = useState('Cash');
            const [returnQty, setReturnQty] = useState('1');
            const [returnItemIndex, setReturnItemIndex] = useState('');
            const [exchangeItems, setExchangeItems] = useState([]);
            const [exchangeItemName, setExchangeItemName] = useState('');
            const [exchangeQty, setExchangeQty] = useState('1');
            const [exchangeUnit, setExchangeUnit] = useState('pcs');
            const [exchangePrice, setExchangePrice] = useState('');

            // Customers that were fully settled and intentionally removed from Credit Book.
            // Sales and settlement history are kept safely; a new credit sale makes the customer appear again.
            const [removedSettledCustomers, setRemovedSettledCustomers] = useState(() => {
                try {
                    const saved = localStorage.getItem('smart_shop_removed_settled_customers_v9');
                    return saved ? JSON.parse(saved) : [];
                } catch (err) {
                    return [];
                }
            });

            // Current Sale Cart State
            const [customerName, setCustomerName] = useState('');
            const [paymentType, setPaymentType] = useState('cash'); // 'cash', 'card', 'online', 'credit', 'split'
            const [paymentMode, setPaymentMode] = useState('Cash');
            const [paidAmountInput, setPaidAmountInput] = useState('');
            const [saleNote, setSaleNote] = useState('');
            const [discount, setDiscount] = useState('');
            
            // Single Item Input State in Cart
            const [currentItem, setCurrentItem] = useState({
                id: null,
                name: '',
                qty: '1',
                unit: 'pcs',
                price: ''
            });
            const [cartItems, setCartItems] = useState([]);

            // Expense Input Form
            const [expenseForm, setExpenseForm] = useState({
                id: null,
                amount: '',
                category: 'Stock Purchase',
                mode: 'Cash',
                note: ''
            });

            // Settlement Modal State for Dues Tab
            const [settleModal, setSettleModal] = useState({ show: false, customer: '', totalDue: 0 });
            const [settleAmount, setSettleAmount] = useState('');
            const [settleMode, setSettleMode] = useState('Cash');

            // Editing states for saved items
            const [editingSale, setEditingSale] = useState(null);

            // Toast Alert & Modals state
            const [toastMessage, setToastMessage] = useState(null);
            const [pdfGenerating, setPdfGenerating] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [confirmDeleteModal, setConfirmDeleteModal] = useState({ show: false, type: null, id: null });

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, salesList, expenseList, duesPayments, returnsList, stockList, cartItems, selectedDate, toastMessage, showSettingsModal, editingSale, settleModal]);

            useEffect(() => {
                localStorage.setItem('smart_shop_sales_v9', JSON.stringify(salesList));
            }, [salesList]);

            useEffect(() => {
                localStorage.setItem('smart_shop_expenses_v9', JSON.stringify(expenseList));
            }, [expenseList]);

            useEffect(() => {
                localStorage.setItem('smart_shop_dues_payments_v9', JSON.stringify(duesPayments));
            }, [duesPayments]);

            useEffect(() => {
                localStorage.setItem('smart_shop_returns_v1', JSON.stringify(returnsList));
            }, [returnsList]);

            useEffect(() => {
                localStorage.setItem('smart_shop_stock_v1', JSON.stringify(stockList));
            }, [stockList]);

            useEffect(() => {
                localStorage.setItem('smart_shop_stock_movements_v1', JSON.stringify(stockMovements));
            }, [stockMovements]);

            useEffect(() => {
                localStorage.setItem('smart_shop_removed_settled_customers_v9', JSON.stringify(removedSettledCustomers));
            }, [removedSettledCustomers]);

            useEffect(() => {
                localStorage.setItem('smart_shop_info_v9', JSON.stringify(shopInfo));
            }, [shopInfo]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            // Filter sales & expenses for the selected date
            const filteredSales = useMemo(() => {
                return salesList.filter(s => s.date === selectedDate);
            }, [salesList, selectedDate]);

            const filteredExpenses = useMemo(() => {
                return expenseList.filter(e => e.date === selectedDate);
            }, [expenseList, selectedDate]);

            // Unified item catalogue: stock items + previously sold items.
            // This powers the type-ahead suggestions so the same item name does not need to be retyped.
            const itemCatalogue = useMemo(() => {
                const map = new Map();
                const add = (name, unit='pcs', price='') => {
                    const clean = String(name || '').trim();
                    if (!clean) return;
                    const key = `${clean.toLowerCase()}__${String(unit || 'pcs').toLowerCase()}`;
                    if (!map.has(key)) map.set(key, { name: clean, unit: unit || 'pcs', price: price !== '' ? Number(price) : '' });
                    else if (map.get(key).price === '' && price !== '') map.get(key).price = Number(price);
                };
                stockList.forEach(st => add(st.name, st.unit));
                salesList.forEach(s => (s.items || []).forEach(i => add(i.name, i.unit, i.price)));
                returnsList.forEach(r => {
                    if (r.item) add(r.item.name, r.item.unit, r.item.price);
                    (r.exchangeItems || []).forEach(i => add(i.name, i.unit, i.price));
                });
                return Array.from(map.values()).sort((a,b) => a.name.localeCompare(b.name));
            }, [stockList, salesList, returnsList]);

            const monthlySales = useMemo(() => salesList.filter(s => String(s.date || '').startsWith(selectedMonth)), [salesList, selectedMonth]);
            const monthlyExpenses = useMemo(() => expenseList.filter(e => String(e.date || '').startsWith(selectedMonth)), [expenseList, selectedMonth]);
            const monthlyReturns = useMemo(() => returnsList.filter(r => String(r.date || '').startsWith(selectedMonth)), [returnsList, selectedMonth]);
            const monthlyDuePayments = useMemo(() => duesPayments.filter(p => String(p.date || '').startsWith(selectedMonth)), [duesPayments, selectedMonth]);
            const monthlySalesTotal = useMemo(() => Math.round((monthlySales.reduce((a,s)=>a+Number(s.totalAmount||0),0) - monthlyReturns.reduce((a,r)=>a+Number(r.returnAmount||0),0))*100)/100, [monthlySales, monthlyReturns]);
            const monthlyCollected = useMemo(() => Math.round((monthlySales.reduce((a,s)=>a+Number(s.paidAmount||0),0) + monthlyDuePayments.reduce((a,p)=>a+Number(p.amount||0),0) - monthlyReturns.filter(r=>r.type==='cash_refund').reduce((a,r)=>a+Number(r.returnAmount||0),0))*100)/100, [monthlySales, monthlyDuePayments, monthlyReturns]);
            const monthlyCredit = useMemo(() => Math.round(monthlySales.reduce((a,s)=>a+Number(s.creditAmount||0),0)*100)/100, [monthlySales]);
            const monthlyExpensesTotal = useMemo(() => Math.round(monthlyExpenses.reduce((a,e)=>a+Number(e.amount||0),0)*100)/100, [monthlyExpenses]);
            const monthlyNet = Math.round((monthlyCollected - monthlyExpensesTotal)*100)/100;

            const totalSalesSelectedDay = useMemo(() => {
                const sales = filteredSales.reduce((sum, item) => sum + Number(item.totalAmount || 0), 0);
                const returned = returnsList.filter(r => r.date === selectedDate).reduce((sum, r) => sum + Number(r.returnAmount || 0), 0);
                return Math.round((sales - returned) * 100) / 100;
            }, [filteredSales, returnsList, selectedDate]);

            const totalReturnsSelectedDay = useMemo(() => returnsList.filter(r => r.date === selectedDate).reduce((sum,r) => sum + Number(r.returnAmount || 0), 0), [returnsList, selectedDate]);

            // Total cash/paid amount actually collected on selected day
            const totalCollectedSelectedDay = useMemo(() => {
                const salesPaid = filteredSales.reduce((sum, item) => sum + Number(item.paidAmount || 0), 0);
                const duePaid = duesPayments.filter(p => p.date === selectedDate).reduce((sum, p) => sum + Number(p.amount || 0), 0);
                const cashRefunds = returnsList.filter(r => r.date === selectedDate && r.type === 'cash_refund').reduce((sum,r) => sum + Number(r.returnAmount || 0), 0);
                return Math.round((salesPaid + duePaid - cashRefunds) * 100) / 100;
            }, [filteredSales, duesPayments, returnsList, selectedDate]);

            // Total credit/due generated on selected day
            const totalCreditGeneratedSelectedDay = useMemo(() => {
                return filteredSales.reduce((sum, item) => sum + Number(item.creditAmount || 0), 0);
            }, [filteredSales]);

            const totalExpensesSelectedDay = useMemo(() => {
                return filteredExpenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
            }, [filteredExpenses]);

            const netProfitSelectedDay = totalCollectedSelectedDay - totalExpensesSelectedDay;

            // Customer Wise Ledger / Dues Calculation
            const customerLedger = useMemo(() => {
                const ledger = {};
                const removed = new Set((removedSettledCustomers || []).map(name => (name || '').trim().toLowerCase()));

                // Process all sales
                salesList.forEach(sale => {
                    const cust = (sale.customer || '').trim();
                    if (!cust || cust.toLowerCase() === 'walk-in customer' || cust.toLowerCase() === 'general customer') return;
                    if (!ledger[cust]) {
                        ledger[cust] = { totalPurchases: 0, totalPaid: 0, totalCredit: 0, currentDue: 0, bills: [] };
                    }
                    ledger[cust].totalPurchases += Number(sale.totalAmount || 0);
                    ledger[cust].totalPaid += Number(sale.paidAmount || 0);
                    ledger[cust].totalCredit += Number(sale.creditAmount || 0);
                    ledger[cust].currentDue += Number(sale.creditAmount || 0);
                    ledger[cust].bills.push(sale);
                });

                // Process settlement payments made against dues
                duesPayments.forEach(pay => {
                    const cust = (pay.customer || '').trim();
                    if (ledger[cust]) {
                        ledger[cust].currentDue -= Number(pay.amount || 0);
                        ledger[cust].totalPaid += Number(pay.amount || 0);
                    }
                });

                // Apply sales returns. Credit-adjustment returns reduce customer due; all returns reduce purchase history.
                returnsList.forEach(ret => {
                    const cust = (ret.customer || '').trim();
                    if (ledger[cust]) {
                        ledger[cust].totalPurchases -= Number(ret.returnAmount || 0);
                        if (ret.type === 'credit_adjustment') ledger[cust].currentDue -= Number(ret.returnAmount || 0);
                        ledger[cust].totalPaid -= Number(ret.type === 'cash_refund' ? ret.returnAmount || 0 : 0);
                    }
                });

                // Avoid floating-point leftovers such as 0.0000001
                Object.keys(ledger).forEach(cust => {
                    ledger[cust].currentDue = Math.max(0, Math.round(ledger[cust].currentDue * 100) / 100);
                });

                // Hide only intentionally removed customers when they are fully settled.
                Object.keys(ledger).forEach(cust => {
                    if (ledger[cust].currentDue <= 0.009 && removed.has(cust.toLowerCase())) {
                        delete ledger[cust];
                    }
                });

                return ledger;
            }, [salesList, duesPayments, returnsList, removedSettledCustomers]);

            const totalPendingDuesAcrossAllCustomers = useMemo(() => {
                let sum = 0;
                Object.values(customerLedger).forEach(c => {
                    if (c.currentDue > 0) sum += c.currentDue;
                });
                return sum;
            }, [customerLedger]);

            // ---------- STOCK HELPERS ----------
            const stockKey = (name, unit) => `${String(name || '').trim().toLowerCase()}__${String(unit || '').trim().toLowerCase()}`;
            const round2 = (n) => Math.round((Number(n) || 0) * 100) / 100;

            const validateStockForItems = (items, excludeSaleId = null) => {
                const required = {};
                (items || []).forEach(i => {
                    const key = stockKey(i.name, i.unit);
                    required[key] = (required[key] || 0) + Number(i.qty || 0);
                });
                const oldItems = excludeSaleId ? (salesList.find(s => s.id === excludeSaleId)?.items || []) : [];
                oldItems.forEach(i => {
                    const key = stockKey(i.name, i.unit);
                    required[key] = (required[key] || 0) - Number(i.qty || 0);
                });
                for (const [key, qty] of Object.entries(required)) {
                    if (qty <= 0) continue;
                    const item = stockList.find(st => stockKey(st.name, st.unit) === key);
                    if (!item) return `Add "${key.split('__')[0]}" to Stock first.`;
                    if (Number(item.qty || 0) + 0.009 < qty) return `Not enough stock for ${item.name}. Available: ${item.qty} ${item.unit}.`;
                }
                return null;
            };

            const applyStockDelta = (items, delta, reason, ref='') => {
                const grouped = {};
                (items || []).forEach(i => {
                    const key = stockKey(i.name, i.unit);
                    grouped[key] = (grouped[key] || 0) + Number(i.qty || 0);
                });

                        )}

                    </main>

                    {/* Sales Return / Exchange Modal */}
                    {returnModal.show && (
                        <div className="fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-3">
                            <div className="bg-white w-full max-w-lg max-h-[92vh] overflow-y-auto rounded-2xl p-4 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <div><h3 className="font-black text-slate-800 text-sm">↩️ Sales Return / Exchange</h3><p className="text-[10px] text-slate-400">Return cash, exchange items, or adjust customer credit.</p></div>
                                    <button type="button" onClick={()=>setReturnModal({show:false})} className="text-slate-400"><Icon name="x" size={18}/></button>
                                </div>
                                <form onSubmit={finalizeReturn} className="space-y-3 text-xs">
                                    <div><label className="block font-bold text-slate-600 mb-1">Find Original Bill</label><input value={returnBillSearch} onChange={e=>setReturnBillSearch(e.target.value)} placeholder="Invoice number or customer name" className="w-full p-2.5 bg-slate-50 border rounded-xl"/></div>
                                    <div className="space-y-1 max-h-32 overflow-y-auto">
                                        {matchingReturnBills.map(s=><button type="button" key={s.id} onClick={()=>{setSelectedReturnSaleId(s.id); setReturnAmount(String(s.totalAmount||''));}} className={`w-full text-left p-2 rounded-lg border ${selectedReturnSaleId===s.id?'border-emerald-500 bg-emerald-50':'border-slate-200 bg-white'}`}><b>{s.invoiceNo}</b> · {s.customer} · {currency} {Number(s.totalAmount||0).toFixed(2)} · {s.date}</button>)}
                                    </div>
                                    {selectedReturnSale && <>
                                        <div className="bg-slate-50 rounded-xl p-3 border"><div className="font-black text-slate-800">{selectedReturnSale.invoiceNo} — {selectedReturnSale.customer}</div><div className="text-[10px] text-slate-500 mt-1">Original bill: {currency} {Number(selectedReturnSale.totalAmount||0).toFixed(2)}</div></div>
                                        <div><label className="block font-bold text-slate-600 mb-1">Returned Item (optional)</label><select value={returnItemIndex} onChange={e=>setReturnItemIndex(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl"><option value="">Whole/unspecified return</option>{selectedReturnSale.items.map((i,idx)=><option key={idx} value={idx}>{i.name} — {i.qty} {i.unit} × {currency} {i.price}</option>)}</select></div>
                                        <div className="grid grid-cols-2 gap-2"><div><label className="block font-bold text-slate-600 mb-1">Return Qty</label><input type="number" min="1" step="any" value={returnQty} onChange={e=>setReturnQty(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl"/></div><div><label className="block font-bold text-slate-600 mb-1">Return Amount ({currency}) *</label><input required type="number" min="0.01" step="0.01" value={returnAmount} onChange={e=>setReturnAmount(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl font-black"/></div></div>
                                        <div><label className="block font-bold text-slate-600 mb-1">Return Type</label><div className="grid grid-cols-3 gap-2"><button type="button" onClick={()=>setReturnType('cash_refund')} className={`p-2 rounded-xl border font-bold ${returnType==='cash_refund'?'bg-rose-600 text-white':'bg-slate-50'}`}>Cash Refund</button><button type="button" onClick={()=>setReturnType('exchange')} className={`p-2 rounded-xl border font-bold ${returnType==='exchange'?'bg-blue-600 text-white':'bg-slate-50'}`}>Exchange</button><button type="button" onClick={()=>setReturnType('credit_adjustment')} className={`p-2 rounded-xl border font-bold ${returnType==='credit_adjustment'?'bg-amber-600 text-white':'bg-slate-50'}`}>Adjust Due</button></div></div>
                                        {returnType==='cash_refund' && <div><label className="block font-bold text-slate-600 mb-1">Refund Method</label><select value={returnMode} onChange={e=>setReturnMode(e.target.value)} className="w-full p-2.5 bg-slate-50 border rounded-xl"><option>Cash</option><option>Card</option><option>Online / UPI</option></select></div>}
                                        {returnType==='exchange' && <div className="border rounded-xl p-3 space-y-2"><div className="font-black text-slate-700">Replacement Item(s)</div><div className="grid grid-cols-2 gap-2"><input placeholder="Item name" value={exchangeItemName} onChange={e=>setExchangeItemName(e.target.value)} className="p-2 border rounded-lg"/><input type="number" min="0.01" step="any" placeholder="Price" value={exchangePrice} onChange={e=>setExchangePrice(e.target.value)} className="p-2 border rounded-lg"/><input type="number" min="0.01" step="any" value={exchangeQty} onChange={e=>setExchangeQty(e.target.value)} className="p-2 border rounded-lg"/><select value={exchangeUnit} onChange={e=>setExchangeUnit(e.target.value)} className="p-2 border rounded-lg">{UNITS.map(u=><option key={u}>{u}</option>)}</select></div><button type="button" onClick={addExchangeItem} className="w-full bg-blue-50 text-blue-700 font-bold p-2 rounded-lg">+ Add Replacement Item</button>{exchangeItems.map(i=><div key={i.id} className="flex justify-between bg-slate-50 p-2 rounded-lg"><span>{i.name} · {i.qty} {i.unit}</span><b>{currency} {i.total.toFixed(2)}</b></div>)}{exchangeItems.length>0&&<div className="font-black text-right">Replacement Total: {currency} {exchangeItems.reduce((a,i)=>a+i.total,0).toFixed(2)}</div>}</div>}
                                        <button type="submit" className="w-full bg-emerald-600 text-white font-black py-3 rounded-xl shadow">Save Return / Exchange</button>
                                    </>}
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Settle Due Payment Modal */}
                    {settleModal.show && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-slate-800 text-sm flex items-center space-x-1.5">
                                        <Icon name="dollar-sign" size={16} />
                                        <span>Settle Credit Due ({settleModal.customer})</span>
                                    </h3>
                                    <button onClick={() => setSettleModal({ show: false, customer: '', totalDue: 0 })} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>

                                <form onSubmit={handleSettleDueSubmit} className="space-y-3 text-xs">
                                    <div className="bg-amber-50 p-3 rounded-xl border border-amber-200 text-amber-900 font-semibold">
                                        Total Pending Due: <span className="font-black">{currency} {settleModal.totalDue}</span>
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">
                                            Payment Amount Received ({currency}) *
                                        </label>
                                        <input 
                                            type="number" 
                                            step="any"
                                            required
                                            value={settleAmount}
                                            onChange={(e) => setSettleAmount(e.target.value)}
                                            className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-black text-base text-slate-800"
                                        />
                                    </div>

                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">
                                            Payment Mode
                                        </label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['Cash', 'Card', 'Online / UPI'].map((m) => (
                                                <button
                                                    key={m}
                                                    type="button"
                                                    onClick={() => setSettleMode(m)}
                                                    className={`py-2 rounded-xl font-bold text-xs border transition ${
                                                        settleMode === m 
                                                            ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' 
                                                            : 'bg-slate-50 text-slate-600 border-slate-200'
                                                    }`}>
                                                    {m}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs shadow">
                                        Confirm & Record Payment
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {showSettingsModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h3 className="font-bold text-slate-800 text-sm flex items-center space-x-1.5">
                                        <Icon name="settings" size={16} />
                                        <span>Shop Settings & Data Backup</span>
                                    </h3>
                                    <button onClick={() => setShowSettingsModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" size={18} />
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">
                                            Shop Name
                                        </label>
                                        <input 
                                            type="text" 
                                            value={shopInfo.name}
                                            onChange={(e) => setShopInfo({...shopInfo, name: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">
                                            Owner / Manager Name
                                        </label>
                                        <input 
                                            type="text" 
                                            value={shopInfo.owner}
                                            onChange={(e) => setShopInfo({...shopInfo, owner: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">
                                            Phone Number
                                        </label>
                                        <input 
                                            type="text" 
                                            value={shopInfo.phone}
                                            onChange={(e) => setShopInfo({...shopInfo, phone: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-slate-600 mb-1">
                                            Shop Address
                                        </label>
                                        <input 
                                            type="text" 
                                            value={shopInfo.address}
                                            onChange={(e) => setShopInfo({...shopInfo, address: e.target.value})}
                                            className="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>

                                    {/* Clear Demo Data & Backup Controls */}
                                    <div className="pt-2 border-t space-y-2">
                                        <div className="font-extrabold text-slate-700 text-[11px]">Data Management & Backup</div>
                                        
                                        <button 
                                            onClick={downloadAppFile}
                                            className="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-xl text-xs font-extrabold flex items-center justify-center space-x-2 shadow-sm">
                                            <Icon name="file-down" size={16} />
                                            <span>Download App File (.html) to Phone</span>
                                        </button>

                                        <div className="grid grid-cols-2 gap-2">
                                            <button 
                                                onClick={exportDataBackup}
                                                className="bg-slate-800 text-white p-2 rounded-xl text-[11px] font-bold flex items-center justify-center space-x-1">
                                                <Icon name="download" size={14} />
                                                <span>Export Data</span>
                                            </button>
                                            <label className="bg-emerald-100 text-emerald-800 p-2 rounded-xl text-[11px] font-bold flex items-center justify-center space-x-1 cursor-pointer border border-emerald-300">
                                                <Icon name="upload" size={14} />
                                                <span>Restore File</span>
                                                <input type="file" accept=".json" onChange={importDataBackup} className="hidden" />
                                            </label>
                                        </div>

                                        <button 
                                            onClick={() => confirmDeleteItem('clear_all', null)}
                                            className="w-full bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-bold p-2 rounded-xl text-[11px] flex items-center justify-center space-x-1">
                                            <Icon name="trash-2" size={14} />
                                            <span>Clear All Data</span>
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => { setShowSettingsModal(false); showToast('Settings updated!'); }}
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow">
                                    Save Details
                                </button>
                            </div>
                        </div>
                    )}

                    {confirmDeleteModal.show && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-xs rounded-2xl p-4 space-y-3 shadow-2xl text-center">
                                <div className="p-3 bg-rose-100 text-rose-600 rounded-full w-12 h-12 mx-auto flex items-center justify-center">
                                    <Icon name="alert-triangle" size={24} />
                                </div>
                                <h3 className="font-extrabold text-slate-800 text-sm">
                                    {confirmDeleteModal.type === 'clear_all' ? 'Clear All Data?' : confirmDeleteModal.type === 'remove_customer' ? 'Remove Customer from Credit Book?' : confirmDeleteModal.type === 'due_payment' ? 'Delete Settlement Record?' : confirmDeleteModal.type === 'stock' ? 'Delete Stock Item?' : 'Delete Record?'}
                                </h3>
                                <p className="text-xs text-slate-500">
                                    {confirmDeleteModal.type === 'clear_all' 
                                        ? 'This will remove all sales, expenses, due payments, return/exchange records and Credit Book data.'
                                        : confirmDeleteModal.type === 'stock'
                                            ? 'The stock item will be removed from current stock. Existing movement history will be kept.'
                                        : confirmDeleteModal.type === 'remove_customer'
                                            ? 'The customer will disappear from Credit Book, but all sales and payment history will be kept safely.'
                                            : confirmDeleteModal.type === 'due_payment'
                                                ? 'Deleting this settlement will recalculate the customer balance. Continue only if this payment entry was recorded by mistake.'
                                                : 'Are you sure you want to delete this entry? This action cannot be undone.'}
                                </p>
                                <div className="grid grid-cols-2 gap-2 pt-2">
                                    <button 
                                        onClick={() => setConfirmDeleteModal({ show: false, type: null, id: null })}
                                        className="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs">
                                        Cancel
                                    </button>
                                    <button 
                                        onClick={executeDelete}
                                        className="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-xl text-xs shadow">
                                        {confirmDeleteModal.type === 'remove_customer' ? 'Yes, Remove' : 'Yes, Delete'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-1/2 transform -translate-x-1/2 w-full max-w-md bg-white border-t border-slate-200 z-40 px-2 py-2 flex justify-around items-center rounded-t-2xl shadow-lg no-print">
                        <button 
                            onClick={() => setActiveTab('home')}
                            className={`flex flex-col items-center py-1 px-2.5 rounded-xl transition ${
                                activeTab === 'home' ? 'text-emerald-700 font-bold' : 'text-slate-400 hover:text-slate-600'
                            }`}>
                            <Icon name="layout-dashboard" size={18} />
                            <span className="text-[10px] mt-1">Home</span>
                        </button>

                        <button 
                            onClick={() => {
                                setEditingSale(null);
                                setCartItems([]);
                                setCustomerName('');
                                setSaleNote('');
                                setPaymentType('cash');
                                setPaidAmountInput('');
                                setActiveTab('new_sale');
                            }}
                            className={`flex flex-col items-center py-1 px-2.5 rounded-xl transition ${
                                activeTab === 'new_sale' ? 'text-emerald-700 font-bold' : 'text-slate-400 hover:text-slate-600'
                            }`}>
                            <Icon name="shopping-bag" size={18} />
                            <span className="text-[10px] mt-1">New Sale</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('stock')}
                            className={`flex flex-col items-center py-1 px-2 rounded-xl transition ${activeTab === 'stock' ? 'text-blue-700 font-bold' : 'text-slate-400 hover:text-slate-600'}`}>
                            <Icon name="package" size={18} />
                            <span className="text-[10px] mt-1">Stock</span>
                        </button>

                        <button
                            onClick={openReturnModal}
                            className="flex flex-col items-center py-1 px-2.5 rounded-xl transition text-slate-400 hover:text-slate-600">
                            <Icon name="rotate-ccw" size={18} />
                            <span className="text-[10px] mt-1">Return</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('dues')}
                            className={`flex flex-col items-center py-1 px-2.5 rounded-xl transition relative ${
                                activeTab === 'dues' ? 'text-amber-700 font-bold' : 'text-slate-400 hover:text-slate-600'
                            }`}>
                            <Icon name="users" size={18} />
                            <span className="text-[10px] mt-1">Credit Book</span>
                        </button>

                        <button 
                            onClick={() => {
                                setExpenseForm({ id: null, amount: '', category: 'Stock Purchase', mode: 'Cash', note: '' });
                                setActiveTab('expenses');
                            }}
                            className={`flex flex-col items-center py-1 px-2.5 rounded-xl transition ${
                                activeTab === 'expenses' ? 'text-rose-600 font-bold' : 'text-slate-400 hover:text-slate-600'
                            }`}>
                            <Icon name="minus-circle" size={18} />
                            <span className="text-[10px] mt-1">Expense</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('reports')}
                            className={`flex flex-col items-center py-1 px-2.5 rounded-xl transition ${
                                activeTab === 'reports' ? 'text-blue-700 font-bold' : 'text-slate-400 hover:text-slate-600'
                            }`}>
                            <Icon name="file-text" size={18} />
                            <span className="text-[10px] mt-1">Report</span>
                        </button>
                    </nav>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body></html>
